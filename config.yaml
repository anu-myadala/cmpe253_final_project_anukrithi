# CMPE 253 course project (Track B) — fair-lending model-risk pipeline on public HMDA data.
# Every script reads this file, so a change here changes the whole run.

project: cmpe253-hmda-fair-lending
seed: 42

# --- data source -------------------------------------------------------------
# CFPB/FFIEC HMDA Data Browser API (public loan-level LAR data, no login needed).
api_base: "https://ffiec.cfpb.gov/v2/data-browser-api/view/csv"
state: "CA"
years:
  train_test: 2024     # model development year (train / validation / test split)
  drift: 2025          # held-out later year for the drift / robustness check
# Filters sent to the API (server side). The API accepts at most TWO filter criteria besides
# year/state, so loan type is filtered locally in prepare.py together with everything else.
api_filters:
  loan_purposes: "1"   # 1 = home purchase
  actions_taken: "1,3" # 1 = loan originated, 3 = application denied

# --- cohort definition (applied locally, in this order; funnel counts are logged) ----
cohort:
  loan_type: ["1"]                       # conventional (not FHA / VA / USDA)
  occupancy_type: ["1"]                  # principal residence
  lien_status: ["1"]                     # first lien
  reverse_mortgage: ["2"]                # not a reverse mortgage
  open-end_line_of_credit: ["2"]         # not a HELOC
  business_or_commercial_purpose: ["2"]  # consumer purpose
  construction_method: ["1"]             # site-built
  total_units: ["1", "2", "3", "4"]      # 1-4 family

# --- target ---------------------------------------------------------------------
# y = 1 when the loan was originated (favourable outcome), y = 0 when denied.
# NOTE: the label is the lender's historical decision, not ground-truth creditworthiness.
target:
  column: action_taken
  positive: "1"
  negative: "3"

# --- sensitive attributes used ONLY for evaluation (never as model inputs) ------
sensitive: [derived_race, derived_ethnicity, derived_sex, applicant_age]
reference_groups:              # the "advantaged"/largest group each gap is measured against
  derived_race: "White"
  derived_ethnicity: "Not Hispanic or Latino"
  derived_sex: "Male"
  applicant_age: "35-44"
intersectional: [derived_race, derived_sex]
min_group_n: 200               # slices smaller than this are flagged, not interpreted (report rule)

# --- model inputs ---------------------------------------------------------------
# Baseline feature set = underwriting-relevant application fields only.
features:
  numeric: [loan_amount, income, combined_loan_to_value_ratio, property_value, loan_term]
  categorical: [debt_to_income_ratio, applicant_credit_score_type, co-applicant_credit_score_type,
                aus-1, submission_of_application, conforming_loan_limit, co_applicant_present]
# Fields kept in the cleaned file for the leakage audit only (never model inputs):
audit_fields: [initially_payable_to_institution, preapproval]
# Census-tract proxies are NOT baseline inputs; they are switched on only in the
# "proxy ablation" to measure how much disparity geography re-introduces.
tract_proxies: [tract_minority_population_percent, tract_to_msa_income_percentage,
                ffiec_msa_md_median_family_income, tract_population]
include_tract_proxies: false
# Fields that are only populated AFTER the decision (pricing, purchaser, denial reasons):
# using them would leak the label, so they are dropped before modelling.
# The leakage audit (src/leakage_audit.py) added two more, which the keyword list had missed:
#   initially_payable_to_institution  code 3 ("not applicable") is reported only when no loan was made -> 100 % denied
#   preapproval                       a requested pre-approval that is denied gets action code 7, so inside
#                                     this originated/denied cohort code 1 is 100 % originated
leakage_drop: [interest_rate, rate_spread, hoepa_status, total_loan_costs, total_points_and_fees,
               origination_charges, discount_points, lender_credits, purchaser_type,
               denial_reason-1, denial_reason-2, denial_reason-3, denial_reason-4,
               intro_rate_period, prepayment_penalty_term,
               initially_payable_to_institution, preapproval]
# Any category with at least this many rows and a 0 % or 100 % approval rate fails the audit:
leakage_audit_min_rows: 100

# --- evaluation protocol --------------------------------------------------------
split: {train: 0.60, val: 0.20, test: 0.20}   # stratified on the label, fixed seed
# Decision threshold, chosen on the VALIDATION split and then frozen for the test split:
#   fixed            -> use `threshold` as is (0.5)
#   match_base_rate  -> approve the same share of applications the lenders approved
#   youden           -> maximise TPR - FPR on the validation split
threshold_rule: match_base_rate
threshold: 0.5
bootstrap_B: 1000
alpha: 0.05

models:
  logistic_regression: {C: 1.0, max_iter: 2000}
  lightgbm: {n_estimators: 400, learning_rate: 0.05, num_leaves: 63, min_child_samples: 50,
             subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8}

# --- fairness ablations (src/ablations.py) -----------------------------------------
ablations:
  group_attr: derived_race            # attribute the interventions target (gaps are still reported for all)
  collapse_small_groups_to: "Other"   # groups under min_group_n in the training split are merged for the interventions only
  reductions: {constraint: demographic_parity, eps: 0.01, max_iter: 50}   # Agarwal et al. exponentiated gradient
  eo_postprocess: {constraint: equalized_odds, objective: balanced_accuracy_score}  # Hardt et al. thresholds

# --- differential-privacy pilot (DP-SGD on the logistic model) ---------------------
dp:
  epsilons: [0.5, 1, 2, 4, 8]
  epochs: 20
  batch_size: 1024          # Poisson sampling rate q = batch_size / n_train
  clip_grid: [1.0, 3.0, 5.0, 10.0]   # per-example L2 clipping norms tried on the validation split
  lr_grid: [0.5, 1.0, 2.0]           # learning rates tried on the validation split
